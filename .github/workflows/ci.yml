name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      AIT_REQUIRE_SHELL_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Enable Linux shell sandbox tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Hosted Ubuntu runners restrict unprivileged namespaces through AppArmor.
          # This ephemeral runner needs them to exercise the production sandbox.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run verify:release
      - run: npm run test:release
      - run: npm run build:paseo
      - run: npm run typecheck --workspace=@getpaseo/desktop --workspace=@getpaseo/app
      - run: npm test --workspace=@getpaseo/desktop
      - run: npm run test --workspace=@getpaseo/app -- src/i18n/resources.test.ts src/runtime/rust-server native-release-version.test.ts

name: Release iOS Beta

# Legacy production/Paseo workflow; this is not the Ait TestFlight path.
on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS beta
    type: build
    params:
      platform: ios
      profile: production

  distribute_ios_beta:
    name: Distribute iOS beta
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      external_groups:
        - Paseo Beta
      submit_beta_review: true

# NOTE: Render through the workspace-create shell scripts before running when
# using ${AIT_MAESTRO_*}. Maestro does not substitute environment vars.
appId: ${AIT_MAESTRO_APP_ID}
---
# Connect to the Ait server only when the app is on the welcome screen.

- runFlow:
    when:
      visible:
        id: "welcome-screen"
    commands:
      - tapOn:
          id: "welcome-direct-connection"

      - extendedWaitUntil:
          visible:
            id: "add-host-modal"
          timeout: 10000

      - tapOn:
          id: "direct-host-advanced-toggle"
      - tapOn:
          id: "direct-host-uri-input"
      - eraseText
      - inputText: ${AIT_MAESTRO_CONNECTION_URI}

      - tapOn:
          id: "direct-host-submit"

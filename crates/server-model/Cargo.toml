[package]
name = "server-model"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22.1"
# Match Paseo's ICU-backed localeCompare for directory ordering and continuation cursors.
icu_collator = "2.3.0"
icu_locale_core = "2.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[lints]
workspace = true
